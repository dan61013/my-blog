name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# Cancel older runs for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, type check, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to commit SHAs to avoid tag tampering.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs pnpm (version from packageManager) and Node.js (from .nvmrc),
      # caches the pnpm store, then runs `pnpm install --frozen-lockfile`.
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
